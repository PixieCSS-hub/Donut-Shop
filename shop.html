<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugar Loop Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <a href="index.html"> <h6>Home</h6> </a>
        <a href="shop.html"> <h6>Shop</h6> </a>
    </div>

     <div class="header">
        <video autoplay muted loop>
            <source src="../images/images/shoppage.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div class="overlay">
            <h1>Freshly Made. Happily Glazed.</h1>
        </div>
    </div>

    <div class="shop">
        <h2>Shop Our Donuts!</h2>
        <h5>Fresh. Fluffy. Delicious.</h5>
        <div class="shopflavors">
            
            <div class="shopflavor">
                <img src="../images/images/strawberrydonut.png" alt="Strawberry Donut">
                <h3>Strawberry</h3>
                <button class="buy">Buy</button>
            </div>
            
            <div class="shopflavor">
                <img src="../images/images/chocolatedonut.png" alt="Chocolate Donut">
                <h3>Chocolate</h3>
                <button class="buy">Buy</button>
            </div>
           
            <div class="shopflavor">
                <img src="../images/images/vanilladonut.png" alt="Vanilla Donut">
                <h3>Vanilla</h3>
                <button class="buy">Buy</button>
            </div>
           
            <div class="shopflavor">
                <img src="../images/images/pistachiodonut.png" alt="Salted Caramel Donut">
                <h3>Pistachio</h3>
                <button class="buy">Buy</button>
            </div>
           
            <div class="shopflavor">    
            <img src="../images/images/lavendercoconut.png" alt="Lavender Coconut Donut">
                <h3>Lavender Coconut</h3>
                <button class="buy">Buy</button>
            </div>
            
            <div class="shopflavor">
            <img src="../images/images/cherrydonut.png" alt="Cherry Donut">
                <h3>Cherry</h3>
                <button class="buy">Buy</button>
            </div>
            
            <div class="shopflavor">
                <img src="../images/images/nepoliandonut.png" alt="Neapolitan Donut">
                <h3>Nepolian</h3>
                <button class="buy">Buy</button>
            </div>
           
           <div class="shopflavor">
            <img src="../images/images/emeraldmint.png" alt="Emerald Mint Donut">
                <h3>Emerald Mint</h3>
                <button class="buy">Buy</button>
            </div>
            
            <div class="shopflavor">
                <img src="../images/images/chocolatechipdonut.png" alt="Chocolate Chip Donut">
                <h3>Cookies and Creme</h3>
                <button class="buy">Buy</button>
            </div>
            
            <div class="shopflavor">
                <img src="../images/images/saltedcaramel.png" alt="Salted Caramel Donut">
                <h3>Salted Carmel</h3>
                <button class="buy">Buy</button>
            </div>

        </div>

        

        </div>

    </body>
    </html>
