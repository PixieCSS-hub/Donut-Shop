<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sugar Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <a href="index.html"> <h6>Home</h6> </a>
        <a href="shop.html"> <h6>Shop</h6> </a>
    </div>

    <div class="header">
        <video autoplay muted loop>
            <source src="./images/images/SugarLoop.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div class="overlay">
            <h1>The Sugar Loop</h1>
            <h5>Where Every Bite is a Sweet Escape</h5>
        </div>
    </div>
    <div class="content">
        <h2>Life’s Better<br> With <br>Sprinkles!</h2>
        <div class="stack">
            <img src="./images/images/donutstack.png" alt="Donut Stack">
        </div>
    </div>

    <div class="newflavors">
        <h2>Hole Up… You Haven’t Tried Our Donuts?!</h2>
        <h5>Shop Our Newest Flavors Now!</h5>
        <div class="flavors">
            <div class="flavor">
                <img src="./images/images/lavendercoconut.png" alt="Lavender Coconut Donut">
                <h3>Lavender Coconut</h3>
            </div>
            <div class="flavor">
                <img src="./images/images/nepoliandonut.png" alt="Neapolitan Donut">
                <h3>Nepolian</h3>
            </div>
            <div class="flavor">
                <img src="./images/images/chocolatechipdonut.png" alt="Chocolate Chip Donut">
                <h3>Cookies and Creme</h3>
            </div>
            <div class="flavor">
                <img src="./images/images/saltedcaramel.png" alt="Salted Caramel Donut">
                <h3>Salted Carmel</h3>
            </div>

        </div>

        <a href="shop.html"> <button class="shopnow">Shop Now!</button> </a>

    </div>
</body>
</html>
